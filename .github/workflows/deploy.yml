name: Trigger Netlify rebuild

# The site is hosted on Netlify; this workflow only pings Netlify's build
# hook so the site rebuilds nightly and picks up edits to the Google Sheet.
# The actual build (npm run build, which calls fetch-books) runs on Netlify.

on:
  schedule:
    - cron: '0 2 * * *'   # 2am UTC every day
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Netlify build hook
        run: curl -fsSL -X POST -d '{}' "$NETLIFY_BUILD_HOOK"
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
